# ══════════════════════════════════════════════════════════════
#  📌 추가 연동 메모 (README 역할)
# ══════════════════════════════════════════════════════════════
#
# [1] ImmigrationCase 등록 시 영상 연결
#     케이스 등록 API (POST /immigration/cases) body에
#     "videoId": 12  를 추가하면 ImmigrationCaseService에서
#     videoService.linkToCase(videoId, caseId) 를 호출하세요.
#
# [2] ConversationPage에서 onRegister 콜백
#     onRegister 실행 시 serverVideoId를 같이 전달해야
#     케이스 등록 폼에서 영상 ID를 자동으로 채울 수 있습니다.
#
#     예시 (부모 컴포넌트):
#       <ConversationPage
#         messages={msgs}
#         videoBlob={blob}
#         userEmail={user.email}
#         onRegister={(videoId) => openRegisterForm({ videoId })}
#       />
#
# [3] 영상 스트리밍 URL
#     GET /api/conversations/video/{id}       → <video> 태그용
#     GET /api/conversations/video/{id}/download → 파일 다운로드
#
# [4] 대용량 영상 → S3/GCS 이전 시
#     ConversationVideoService.upload() 내부만 교체하면 됩니다.
#     filePath 대신 S3 key를 저장하고,
#     getVideoResource() 대신 presigned URL redirect를 반환하세요.