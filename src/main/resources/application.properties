spring.application.name=SignBridge

spring.config.import=optional:classpath:application-local.properties

# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/signbridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.profiles.active=local
# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web.socket=TRACE
logging.level.org.springframework.messaging=TRACE

# 로그
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 영상 업로드 디렉토리
signbridge.video.upload-dir=./videos

# Multipart 파일 크기 제한
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# API Keys (실제 값은 application-local.properties에)
anthropic.api.key=${ANTHROPIC_API_KEY}
openai.api.key=${OPENAI_API_KEY}
google.client.id=${GOOGLE_CLIENT_ID}
google.gemini.api.key=${GEMINI_API_KEY}